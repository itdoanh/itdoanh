<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff0000"/>
  <title>Tết 2026 - Chúc Mừng Năm Mới Bính Ngọ</title>

  <!-- Fonts & CDNs -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;800&family=Dancing+Script:wght@600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root{ --red:#dc143c; --gold:#ffd700; --white:#fff; --ink:#2b2b2b; }
    *{box-sizing:border-box; margin:0; padding:0}
    html,body{height:100%; overflow:hidden}
    body{
      font-family:'Be Vietnam Pro',system-ui,-apple-system,Segoe UI,Roboto,Arial; 
      color:var(--ink); 
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 50%, #c92a2a 100%);
      position: relative;
    }

    /* Lanterns floating */
    .lantern {
      position: absolute;
      width: 60px;
      height: 80px;
      background: linear-gradient(to bottom, #ff0000, #cc0000);
      border-radius: 0 0 30px 30px;
      animation: float 4s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }
    .lantern:before {
      content: '';
      position: absolute;
      top: -10px;
      left: 10%;
      width: 80%;
      height: 10px;
      background: #8b0000;
      border-radius: 5px;
    }
    .lantern:after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 15px;
      background: #ffd700;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    .lantern:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
    .lantern:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; }
    .lantern:nth-child(3) { top: 60%; left: 20%; animation-delay: 2s; }
    .lantern:nth-child(4) { top: 70%; right: 10%; animation-delay: 0.5s; }

    /* Main container */
    .container {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 10;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,250,240,0.95));
      border-radius: 30px;
      padding: 50px 40px;
      max-width: 800px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,215,0,0.3);
      position: relative;
      overflow: hidden;
    }

    .card:before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: repeating-linear-gradient(90deg, #ff0000 0, #ff0000 20px, #ffd700 20px, #ffd700 40px);
    }

    .year {
      font-size: clamp(60px, 15vw, 120px);
      font-weight: 800;
      background: linear-gradient(135deg, #ff0000 0%, #ffd700 50%, #ff0000 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
      margin-bottom: 20px;
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { filter: brightness(1) hue-rotate(0deg); }
      50% { filter: brightness(1.2) hue-rotate(10deg); }
    }

    .title {
      font-size: clamp(24px, 6vw, 42px);
      font-weight: 700;
      color: #dc143c;
      margin-bottom: 30px;
      font-family: 'Dancing Script', cursive;
    }

    .greeting {
      font-size: clamp(16px, 4vw, 24px);
      color: #2b2b2b;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .wishes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .wish-item {
      background: linear-gradient(135deg, #fff5f5, #ffebeb);
      padding: 20px;
      border-radius: 15px;
      border: 2px solid #ff000030;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .wish-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(220, 20, 60, 0.2);
    }

    .wish-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .wish-text {
      font-weight: 600;
      color: #c92a2a;
      font-size: 18px;
    }

    .signature {
      margin-top: 40px;
      font-style: italic;
      color: #666;
      font-size: 16px;
    }

    .firework-btn {
      margin-top: 30px;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #ff0000, #dc143c);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(220, 20, 60, 0.4);
      transition: all 0.3s ease;
    }

    .firework-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(220, 20, 60, 0.6);
    }

    .firework-btn:active {
      transform: scale(0.95);
    }

    /* Falling petals */
    @keyframes fall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0.5; }
    }

    .petal {
      position: absolute;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #ff6b9d, #c92a2a);
      border-radius: 50%;
      opacity: 0.7;
      animation: fall linear infinite;
    }
  </style>
</head>
<body>
  <!-- Lanterns -->
  <div class="lantern"></div>
  <div class="lantern"></div>
  <div class="lantern"></div>
  <div class="lantern"></div>

  <!-- Main content -->
  <div class="container">
    <div class="card">
      <div class="year">2026</div>
      <div class="title">Chúc Mừng Năm Mới Bính Ngọ</div>
      
      <div class="greeting">
        Xuân về, vạn vật đổi mới!<br>
        Kính chúc quý vị một năm mới an khang, thịnh vượng,<br>
        Phúc lộc đầy nhà, sức khỏe dồi dào!
      </div>

      <div class="wishes">
        <div class="wish-item">
          <div class="wish-icon">💰</div>
          <div class="wish-text">Tài Lộc Dồi Dào</div>
        </div>
        <div class="wish-item">
          <div class="wish-icon">🏮</div>
          <div class="wish-text">Vạn Sự Như Ý</div>
        </div>
        <div class="wish-item">
          <div class="wish-icon">🎊</div>
          <div class="wish-text">Sức Khỏe Dồi Dào</div>
        </div>
        <div class="wish-item">
          <div class="wish-icon">🌸</div>
          <div class="wish-text">Gia Đình Hạnh Phúc</div>
        </div>
      </div>

      <button class="firework-btn" onclick="celebrate()">🎆 Bắn Pháo Hoa</button>

      <div class="signature">
        — Chúc mừng năm mới từ ITDoanh —
      </div>
    </div>
  </div>

  <script>
    // Create falling petals
    function createPetals() {
      for (let i = 0; i < 30; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + '%';
        petal.style.animationDuration = (Math.random() * 3 + 5) + 's';
        petal.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(petal);
      }
    }

    // Fireworks celebration
    function celebrate() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        const particleCount = 50 * (timeLeft / duration);

        confetti({
          ...defaults,
          particleCount,
          origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
          colors: ['#ff0000', '#ffd700', '#ff6b9d']
        });
        confetti({
          ...defaults,
          particleCount,
          origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
          colors: ['#ff0000', '#ffd700', '#ff6b9d']
        });
      }, 250);
    }

    // Initialize
    createPetals();
    
    // Auto celebrate on load
    setTimeout(() => {
      celebrate();
    }, 1000);
  </script>
</body>
</html>
